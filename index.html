<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Frontend Mentor | Social links profile</title>

  <link rel="stylesheet" href="./css/style.css">

</head>

<body>
  <main class="card">
    <img src="./assets/images/avatar-jessica.jpeg" alt="" class="mainImg">

    <section class="name">
      <h1>Jessica Randall</h1>
      <h4>London, United Kingdom</h4>
    </section>

    <span class="description">
      "Frontend developer and avid reader."
    </span>

    <section class="links">
      <button><a href="#">GitHub</a></button>
      <button><a href="#">Frontend Mentor</a></button>
      <button><a href="#">LinkedIn</a></button>
      <button><a href="#">Twitter</a></button>
      <button><a href="#">Instagram</a></button>
    </section>
  </main>
</body>

</html>
